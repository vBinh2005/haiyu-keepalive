name: Giữ máy chủ HaiYu thức

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi /api/health (chờ tối đa 3 phút nếu máy đang thức dậy)
        run: curl -fsS --max-time 180 --retry 3 --retry-delay 10 https://haiyu-api.onrender.com/api/health
